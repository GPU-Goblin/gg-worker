[package]
name = "gg-worker"
description = "GPU Goblin contributor agent (gg-worker) and separated executor process (gg-executor)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "gg-worker"
path = "src/bin/gg-worker.rs"

[[bin]]
name = "gg-executor"
path = "src/bin/gg-executor.rs"

[features]
default = []
gpu = ["gg-compute/gpu"]
# Native CUDA engine (ADR-0033): LibTorch 2.9 at build and run time (`libtorch_dir`).
cuda = ["gg-compute/cuda"]


[dependencies]
gg-core = { workspace = true }
gg-protocol = { workspace = true }
gg-compute = { workspace = true }
gg-client = { workspace = true, features = ["p2p"] }
tokio = { workspace = true }
futures-util = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
clap = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
hex = { workspace = true }
getrandom = { workspace = true }
tempfile = { workspace = true }
axum = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
aws-lc-rs = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
landlock = "0.4.7"
seccompiler = "0.5.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Isolation",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[dev-dependencies]
tempfile = { workspace = true }
