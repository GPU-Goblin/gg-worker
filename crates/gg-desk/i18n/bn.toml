"To everyone who lends their computer, to the scientists who trust the grid with their work, and to those who tested it first." = "যাঁরা নিজেদের কম্পিউটার দেন, যে বিজ্ঞানীরা নিজেদের কাজ গ্রিডের হাতে তুলে দেন, আর যাঁরা প্রথম এটি পরীক্ষা করেছেন, তাঁদের সবাইকে।"
"Version {v} · computing power for science, lent by everyone" = "সংস্করণ {v} · বিজ্ঞানের জন্য কম্পিউটিং শক্তি, সবার দেওয়া"
"GPU for science" = "বিজ্ঞানের জন্য GPU"
"Enter your e-mail. We'll send you a code." = "আপনার ইমেইল দিন। আমরা আপনাকে একটি কোড পাঠাব।"
"Enter your code" = "আপনার কোড দিন"
"Sent to {email}." = "{email}-এ পাঠানো হয়েছে।"
"Remove GPU Goblin from this computer?" = "এই কম্পিউটার থেকে GPU Goblin সরাবেন?"
"Also delete this computer's worker key and settings? It will then have to be attached to your account again." = "এই কম্পিউটারের কী ও সেটিংসও মুছবেন? তাহলে এটিকে আবার আপনার অ্যাকাউন্টের সঙ্গে যুক্ত করতে হবে।"
"GPU Goblin was removed." = "GPU Goblin সরানো হয়েছে।"
