name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # File and line in backtraces without full debug information: the test binaries of the whole
  # workspace otherwise fill the runner's disk.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  rust:
    name: fmt, clippy, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup show   # rust-toolchain.toml pins the version
      - uses: Swatinem/rust-cache@v2
      # Ubuntu 24.04 and later give unprivileged user namespaces only to programs whose AppArmor
      # profile allows them: bwrap gets one (a contributor's machine needs the same), then must work.
      - name: bubblewrap and its AppArmor profile (required by the sandbox tests)
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          printf 'abi <abi/4.0>,\ninclude <tunables/global>\nprofile bwrap /usr/bin/bwrap flags=(unconfined) {\n  userns,\n}\n' \
            | sudo tee /etc/apparmor.d/bwrap > /dev/null
          sudo apparmor_parser -r /etc/apparmor.d/bwrap
          bwrap --ro-bind / / --unshare-all true
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The runners have no GPU: the GPU engine is only compiled here.
      - name: GPU variant compiles
        run: cargo clippy --workspace --all-targets --features gg-worker/gpu -- -D warnings
