name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: fmt, clippy, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup show   # rust-toolchain.toml pins the version
      - uses: Swatinem/rust-cache@v2
      - name: bubblewrap (required by the sandbox tests)
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The runners have no GPU: the GPU engine is only compiled here.
      - name: GPU variant compiles
        run: cargo clippy --workspace --all-targets --features gg-worker/gpu -- -D warnings
